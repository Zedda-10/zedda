<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>
    <meta
      name="description"
      content="Chat in tempo reale con nome utente e stanza pubblica"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <span class="brand-mark">C</span>
          <div>
            <p class="eyebrow">Chat in diretta</p>
            <h1>Room Live</h1>
          </div>
        </div>

        <form id="loginForm" class="login-card">
          <label for="nameInput">Scrivi il tuo nome</label>
          <input
            id="nameInput"
            name="name"
            type="text"
            maxlength="20"
            placeholder="Es. Marco"
            autocomplete="off"
            required
          />
          <button type="submit">Entra nella chat</button>
        </form>

        <div class="status-box">
          <span class="dot" id="connectionDot"></span>
          <span id="connectionText">Preparando la connessione...</span>
        </div>

        <button id="logoutBtn" class="ghost-button hidden" type="button">
          Cambia nome
        </button>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <span class="live-pill">Live</span>
            <h2>Stanza pubblica</h2>
          </div>
          <span id="onlineCount" class="online-count">0 online</span>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chatForm" class="composer">
          <input
            id="messageInput"
            type="text"
            maxlength="280"
            placeholder="Scrivi un messaggio..."
            autocomplete="off"
            required
          />
          <button type="submit">Invia</button>
        </form>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="script.js"></script>
  </body>
</html>
